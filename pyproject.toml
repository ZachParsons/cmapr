[project]
name = "concept-mapper"
version = "1.0.0"
description = "A tool for extracting and visualizing an author's idiosyncratic conceptual vocabulary from primary texts"
authors = [{name = "Zach"}]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    # Core NLP dependencies
    "nltk>=3.8",          # Tokenization, POS tagging, lemmatization
    "inflect>=7.0",       # Inflection generation for synonym replacement
    "stanza>=1.8",        # Dependency parsing for sentence diagrams
    "networkx>=3.2",      # Graph construction and algorithms
    "click>=8.1",         # Command-line interface
    "pdfplumber>=0.10",   # PDF text extraction
]

[project.optional-dependencies]
spacy = [
    "spacy>=3.8",             # Noun chunks + dependency-parse relation extraction
]
embeddings = [
    "sentence-transformers>=3.0",  # Definitional-sentence ranking; pulls torch + transformers
]
coref = [
    "fastcoref>=2.1",         # Pronoun→antecedent resolution at ingest; pulls torch + transformers
    "transformers<4.50",      # fastcoref breaks on the 4.5x tied-weights refactor
]
serve = [
    "fastapi>=0.115",         # Web framework for local UI
    "uvicorn>=0.32",          # ASGI server
    "jinja2>=3.1",            # HTML templating
    "python-multipart>=0.0.9",# Form data parsing
    "httpx>=0.27",            # TestClient for server tests
]
dev = [
    # Essential dev tools
    "pytest>=8.3",        # Tests ⭐
    "pytest-cov>=5.0",    # Test coverage ⭐
    "ruff>=0.6",          # Linter + formatter ⭐
    "ipython>=8.27",      # REPL w/ autoreload ⭐
    "reportlab>=4.0",     # PDF generation for tests
]

[project.scripts]
cmapr = "concept_mapper.cli:cli"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
