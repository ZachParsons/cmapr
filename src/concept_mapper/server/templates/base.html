<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>cmapr{% block title %}{% endblock %}</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
           font-size: 14px; color: #222; background: #f7f7f7; }
    header { background: #1a1a2e; color: #e0e0e0; padding: 10px 24px;
             display: flex; align-items: center; gap: 8px; font-size: 13px; }
    header .brand { color: #90caf9; text-decoration: none; font-weight: 600; }
    header .brand:hover { color: #b3dafc; }
    header .breadcrumb { display: flex; align-items: center; gap: 8px; }
    header .breadcrumb a { color: #aaa; text-decoration: none; }
    header .breadcrumb a:hover { color: #e0e0e0; }
    header .sep { color: #555; }
    header .current { color: #e0e0e0; }
    main { max-width: 860px; margin: 32px auto; padding: 0 24px; }
    main.full { max-width: none; margin: 0; padding: 16px 24px; }
    h1 { font-size: 20px; font-weight: 600; margin-bottom: 20px; }
    h2 { font-size: 15px; font-weight: 600; margin-bottom: 12px; color: #444; }
    .card { background: #fff; border: 1px solid #e0e0e0; border-radius: 6px;
            padding: 20px 24px; margin-bottom: 20px; }
    label { display: block; margin-bottom: 8px; cursor: pointer; }
    input[type=text], input[type=number] {
      width: 100%; padding: 7px 10px; border: 1px solid #ccc; border-radius: 4px;
      font-size: 13px; margin-top: 4px; }
    input[type=text]:focus, input[type=number]:focus {
      outline: none; border-color: #4e79a7; }
    .btn { display: inline-block; padding: 8px 18px; border-radius: 4px;
           border: none; cursor: pointer; font-size: 13px; font-weight: 500;
           text-decoration: none; }
    .btn-primary { background: #1a1a2e; color: #fff; }
    .btn-primary:hover { background: #2a2a4e; }
    .btn-secondary { background: #e8e8e8; color: #333; }
    .btn-secondary:hover { background: #d8d8d8; }
    .error { background: #fff0f0; border: 1px solid #f5c6c6; border-radius: 4px;
             padding: 10px 14px; margin-bottom: 16px; color: #c00; font-size: 13px; }
    .field { margin-bottom: 14px; }
    .field-label { font-weight: 500; margin-bottom: 4px; display: block; }
    .hint { color: #888; font-size: 12px; margin-top: 3px; }
    details summary { cursor: pointer; color: #4e79a7; font-size: 13px;
                      padding: 6px 0; user-select: none; }
    details[open] summary { margin-bottom: 12px; }
    .btn:disabled { opacity: 0.7; cursor: wait; }
    .spinner { display: inline-block; width: 14px; height: 14px;
               border: 2px solid rgba(255,255,255,0.35); border-top-color: #fff;
               border-radius: 50%; animation: cmapr-spin 0.8s linear infinite;
               vertical-align: -2px; margin-right: 8px; }
    .btn-secondary .spinner { border-color: rgba(0,0,0,0.15); border-top-color: #333; }
    @keyframes cmapr-spin { to { transform: rotate(360deg); } }
    .loading-overlay { position: fixed; inset: 0; background: rgba(247,247,247,0.82);
                       display: none; align-items: center; justify-content: center;
                       z-index: 1000; backdrop-filter: blur(2px); }
    .loading-overlay.active { display: flex; }
    .loading-box { background: #fff; border: 1px solid #e0e0e0; border-radius: 6px;
                   padding: 20px 28px; box-shadow: 0 4px 16px rgba(0,0,0,0.08);
                   display: flex; align-items: center; gap: 14px; min-width: 280px; }
    .loading-box .spinner { width: 20px; height: 20px; border-width: 3px;
                            border-color: #e0e0e0; border-top-color: #1a1a2e;
                            margin: 0; vertical-align: 0; }
    .loading-title { font-weight: 600; }
    .loading-hint { color: #888; font-size: 12px; margin-top: 2px; }
  </style>
</head>
<body>
  <header>
    <a href="/" class="brand">cmapr</a>
    <span class="sep">›</span>
    <span class="breadcrumb">{% block breadcrumb %}{% endblock %}</span>
  </header>
  <main class="{% block main_class %}{% endblock %}">
    {% block content %}{% endblock %}
  </main>

  <div id="loading" class="loading-overlay" role="status" aria-live="polite" aria-hidden="true">
    <div class="loading-box">
      <div class="spinner"></div>
      <div>
        <div class="loading-title">Processing…</div>
        <div class="loading-hint">This may take a minute for large texts.</div>
      </div>
    </div>
  </div>

  <script>
    (function () {
      var overlay = document.getElementById('loading');

      document.addEventListener('submit', function (e) {
        var form = e.target;
        if (!form || (form.method || '').toLowerCase() !== 'post') return;
        if (!form.checkValidity()) return;

        if (overlay) {
          overlay.classList.add('active');
          overlay.setAttribute('aria-hidden', 'false');
        }
        var submits = form.querySelectorAll('button[type=submit], input[type=submit]');
        submits.forEach(function (b) {
          b.dataset.origText = b.innerHTML;
          b.disabled = true;
          b.innerHTML = '<span class="spinner"></span>Processing…';
        });
      });

      // Reset state if the page is restored from bfcache (back/forward nav).
      window.addEventListener('pageshow', function () {
        if (overlay) {
          overlay.classList.remove('active');
          overlay.setAttribute('aria-hidden', 'true');
        }
        document.querySelectorAll('button[type=submit], input[type=submit]').forEach(function (b) {
          if (b.dataset.origText !== undefined) {
            b.disabled = false;
            b.innerHTML = b.dataset.origText;
            delete b.dataset.origText;
          }
        });
      });
    })();
  </script>
</body>
</html>
