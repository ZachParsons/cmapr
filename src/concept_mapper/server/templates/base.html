<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>cmapr{% block title %}{% endblock %}</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
           font-size: 14px; color: #222; background: #f7f7f7; }
    header { background: #1a1a2e; color: #e0e0e0; padding: 10px 24px;
             display: flex; align-items: center; gap: 16px; }
    header a { color: #90caf9; text-decoration: none; font-weight: 600; font-size: 16px; }
    header .breadcrumb { color: #aaa; font-size: 13px; }
    main { max-width: 860px; margin: 32px auto; padding: 0 24px; }
    h1 { font-size: 20px; font-weight: 600; margin-bottom: 20px; }
    h2 { font-size: 15px; font-weight: 600; margin-bottom: 12px; color: #444; }
    .card { background: #fff; border: 1px solid #e0e0e0; border-radius: 6px;
            padding: 20px 24px; margin-bottom: 20px; }
    label { display: block; margin-bottom: 8px; cursor: pointer; }
    input[type=text], input[type=number] {
      width: 100%; padding: 7px 10px; border: 1px solid #ccc; border-radius: 4px;
      font-size: 13px; margin-top: 4px; }
    input[type=text]:focus, input[type=number]:focus {
      outline: none; border-color: #4e79a7; }
    .btn { display: inline-block; padding: 8px 18px; border-radius: 4px;
           border: none; cursor: pointer; font-size: 13px; font-weight: 500;
           text-decoration: none; }
    .btn-primary { background: #1a1a2e; color: #fff; }
    .btn-primary:hover { background: #2a2a4e; }
    .btn-secondary { background: #e8e8e8; color: #333; }
    .btn-secondary:hover { background: #d8d8d8; }
    .error { background: #fff0f0; border: 1px solid #f5c6c6; border-radius: 4px;
             padding: 10px 14px; margin-bottom: 16px; color: #c00; font-size: 13px; }
    .field { margin-bottom: 14px; }
    .field-label { font-weight: 500; margin-bottom: 4px; display: block; }
    .hint { color: #888; font-size: 12px; margin-top: 3px; }
    details summary { cursor: pointer; color: #4e79a7; font-size: 13px;
                      padding: 6px 0; user-select: none; }
    details[open] summary { margin-bottom: 12px; }
  </style>
</head>
<body>
  <header>
    <a href="/">cmapr</a>
    <span class="breadcrumb">{% block breadcrumb %}{% endblock %}</span>
  </header>
  <main>
    {% block content %}{% endblock %}
  </main>
</body>
</html>
